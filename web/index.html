<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPlan IA</title>
<link rel="icon" href="img/logo-nutriplan-ia.png">
<style>
  :root { --harina: #FFF8F1; --leche: #FFFFFF; --linea: #EFE2D4; --cacao: #2B211C; --canela: #6A584C; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --harina: #17120F; --leche: #221B17; --linea: #3A2F28; --cacao: #F7EEE6; --canela: #CDBBAE; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--harina); color: var(--cacao); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { max-width: 440px; background: var(--leche); border: 1px solid var(--linea); border-radius: 24px; padding: 32px 28px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  img { width: 188px; height: auto; margin: 0 auto; }
  p { margin: 0; line-height: 1.5; }
  .suave { color: var(--canela); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="img/logo-nutriplan-ia.png" width="188" height="50" alt="NutriPlan IA">
  <p>Planificador de comidas con inteligencia artificial para familias y estudiantes de Pasto.</p>
  <p class="suave">Proyecto académico · App para Android en piloto.</p>
</main>
</body>
</html>
