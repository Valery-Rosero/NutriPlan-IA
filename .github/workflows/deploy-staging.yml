name: Desplegar migraciones a staging

# Requiere dos secretos en GitHub › Settings › Environments › staging:
#   SUPABASE_ACCESS_TOKEN  (supabase.com › Account › Access Tokens)
#   SUPABASE_DB_PASSWORD   (contraseña de la base del proyecto nutriplan-staging)
# Las Edge Functions y los secretos se despliegan a mano (docs/07-plan-de-construccion/publicacion-android.md).
on:
  push:
    branches: [main]
    paths: ['backend/supabase/migrations/**', 'backend/supabase/catalog/**']
  workflow_dispatch:

concurrency: deploy-staging

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Comprobar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_DB_PASSWORD en Settings › Environments › staging."
            exit 1
          fi
      - name: Migraciones y catálogo a staging
        working-directory: backend
        # --remote: la CLI actual apunta a la base local por defecto. --yes: sin preguntas en CI.
        run: |
          npx --yes supabase link --project-ref fiesvxiuxsllqcpxidap --yes
          npx supabase db push --remote --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
