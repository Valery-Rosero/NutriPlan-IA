name: Desplegar migraciones a staging

# Requiere el secreto SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access Tokens).
on:
  push:
    branches: [main]
    paths: ['backend/supabase/migrations/**']
  workflow_dispatch:

concurrency: deploy-staging

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: backend
        run: |
          npx --yes supabase link --project-ref fiesvxiuxsllqcpxidap
          npx supabase db push
