<!-- Asunto: Confirma tu nuevo correo en NutriPlan -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #25344F;">
  <div style="background: #25344F; padding: 24px; border-radius: 16px 16px 0 0;">
    <p style="margin: 0; color: #B4C2D3; font-size: 13px; letter-spacing: 1px;">NUTRIPLAN</p>
    <h1 style="margin: 8px 0 0; color: #D5B893; font-family: Georgia, serif; font-weight: normal; font-size: 26px;">
      Confirma tu nuevo correo
    </h1>
  </div>
  <div style="background: #FFFDF9; padding: 24px; border: 1px solid #E8DFD3; border-top: 0; border-radius: 0 0 16px 16px;">
    <p style="font-size: 16px; line-height: 1.5;">
      Pediste cambiar el correo de tu cuenta a <strong>{{ .NewEmail }}</strong>. Confírmalo para terminar.
    </p>
    <p style="text-align: center; margin: 28px 0;">
      <a href="{{ .ConfirmationURL }}"
         style="background: #25344F; color: #D5B893; padding: 14px 28px; border-radius: 999px; text-decoration: none; font-size: 16px; display: inline-block;">
        Confirmar el cambio
      </a>
    </p>
    <p style="font-size: 13px; line-height: 1.5; color: #617891;">
      Si no lo pediste tú, ignora este correo y tu cuenta sigue con el correo de siempre.
    </p>
  </div>
</div>
